<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LegalMind — AI Legal Document Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .app-wrapper {
            width: 560px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            height: 720px;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #1e3a8a, #1e40af);
            color: white;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .avatar {
            width: 48px; height: 48px;
            background: rgba(255,255,255,0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .header-text h2 { font-size: 17px; font-weight: 600; }
        .header-text p { font-size: 12px; opacity: 0.85; margin-top: 3px; }

        .results-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8fafc;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .qa-block {
            background: white;
            border-radius: 14px;
            padding: 16px 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .question-text {
            font-weight: 600;
            color: #1e3a8a;
            font-size: 14px;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e5e7eb;
        }

        .answer-text {
            color: #374151;
            font-size: 14px;
            line-height: 1.7;
            white-space: pre-wrap;
        }

        .meta-row {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .source-tag {
            background: #eff6ff;
            color: #1e40af;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
        }

        .confidence-tag {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }

        .confidence-high { background: #dcfce7; color: #166534; }
        .confidence-medium { background: #fef9c3; color: #854d0e; }
        .confidence-low { background: #fee2e2; color: #991b1b; }
        .confidence-none { background: #f3f4f6; color: #6b7280; }

        .loading-block {
            background: white;
            border-radius: 14px;
            padding: 20px;
            text-align: center;
            color: #9ca3af;
            font-size: 13px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .sample-questions {
            padding: 12px 16px;
            background: #f8fafc;
            border-top: 1px solid #e5e7eb;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .sample-chip {
            background: white;
            border: 1.5px solid #dbeafe;
            color: #1e40af;
            padding: 6px 12px;
            border-radius: 18px;
            font-size: 11.5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .sample-chip:hover {
            background: #1e40af;
            color: white;
            border-color: #1e40af;
        }

        .input-area {
            padding: 16px;
            background: white;
            border-top: 1px solid #e5e7eb;
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 13px 18px;
            border: 1.5px solid #e5e7eb;
            border-radius: 26px;
            font-size: 14px;
            outline: none;
            background: #f9fafb;
        }

        .input-area input:focus {
            border-color: #1e40af;
            background: white;
        }

        .ask-btn {
            background: linear-gradient(135deg, #1e3a8a, #1e40af);
            color: white;
            border: none;
            padding: 0 24px;
            border-radius: 26px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .ask-btn:hover { opacity: 0.9; }

        .results-area::-webkit-scrollbar { width: 4px; }
        .results-area::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body>

<div class="app-wrapper">

    <div class="header">
        <div class="avatar">⚖️</div>
        <div class="header-text">
            <h2>LegalMind — AI Legal Assistant</h2>
            <p>Ask questions about your contracts and agreements</p>
        </div>
    </div>

    <div class="results-area" id="results">
        <div class="qa-block">
            <div class="answer-text">Welcome to LegalMind. I have access to your employment contract, NDA agreement, and rental agreement. Ask me anything about the terms, and I will answer based only on the actual documents with source citations.</div>
        </div>
    </div>

    <div class="sample-questions">
        <button class="sample-chip" onclick="askSample('Can I terminate the employment contract immediately for a material breach?')">Termination for breach?</button>
        <button class="sample-chip" onclick="askSample('How long does confidentiality last after the NDA ends?')">NDA duration?</button>
        <button class="sample-chip" onclick="askSample('What is the security deposit for the rental agreement?')">Rental deposit?</button>
    </div>

    <div class="input-area">
        <input
            type="text"
            id="questionInput"
            placeholder="Ask a question about your legal documents..."
            onkeypress="if(event.key==='Enter') askQuestion()"
            autocomplete="off"
        >
        <button class="ask-btn" onclick="askQuestion()">Ask</button>
    </div>

</div>

<script>
    async function askQuestion() {
        const input = document.getElementById("questionInput");
        const question = input.value.trim();
        if (!question) return;

        input.value = "";
        input.disabled = true;

        const loadingBlock = showLoading();

        try {
            const response = await fetch("/ask", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ question: question })
            });

            const data = await response.json();
            loadingBlock.remove();

            if (data.detail) {
                addResult(question, "Sorry, something went wrong: " + data.detail, [], "none");
            } else {
                addResult(question, data.answer, data.sources, data.confidence);
            }

        } catch (error) {
            loadingBlock.remove();
            addResult(question, "Connection error. Please try again.", [], "none");
        } finally {
            input.disabled = false;
            input.focus();
        }
    }

    function askSample(text) {
        document.getElementById("questionInput").value = text;
        askQuestion();
    }

    function addResult(question, answer, sources, confidence) {
        const container = document.getElementById("results");
        const block = document.createElement("div");
        block.className = "qa-block";

        let sourcesHtml = "";
        sources.forEach(s => {
            sourcesHtml += `<span class="source-tag">📄 ${s}</span>`;
        });

        block.innerHTML = `
            <div class="question-text">Q: ${question}</div>
            <div class="answer-text">${answer}</div>
            <div class="meta-row">
                ${sourcesHtml}
                <span class="confidence-tag confidence-${confidence}">${confidence} confidence</span>
            </div>
        `;

        container.appendChild(block);
        container.scrollTop = container.scrollHeight;
    }

    function showLoading() {
        const container = document.getElementById("results");
        const block = document.createElement("div");
        block.className = "loading-block";
        block.textContent = "Searching documents and generating answer...";
        container.appendChild(block);
        container.scrollTop = container.scrollHeight;
        return block;
    }
</script>

</body>
</html>
